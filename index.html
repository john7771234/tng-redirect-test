<html>

<body>
<h2 style="text-align:center;font-family:-apple-system,sans-serif;margin-top:40px;">
  Opening TNG...
</h2>

<script>
const deepLink = "tngdwallet://client/dl/transfer/moneyPacket/claim?p=ddb9c7e544e8b08c06394db076aa78985c16c24ea5abdfb18d2a104db6c389aab4ede2bc0e64dece5e1e43d5831c587a6669b66dd1fa35409156d8da957f7c9bb2ed7774302d36aaf9bb06f9e5c06935&v=2";

function openTNG() {
  window.location.href = deepLink;
}

function closeTelegramWebView() {
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
      window.Telegram.WebApp.close();
      return;
    }
  } catch (e) {}

  try {
    window.location.href = "tg://resolve";
  } catch (e) {}

  try {
    window.close();
  } catch (e) {}
}

// 触发 deep link,然后关闭 Telegram WebView
openTNG();
setTimeout(closeTelegramWebView, 800);
</script>
