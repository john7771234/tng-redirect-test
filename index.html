<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TNG Test</title>
</head>
<body>
<h2>Opening TNG...</h2>
<button onclick="openTNG()">Open TNG</button>
<script>
const fallbackURL = "https://www.touchngo.com.my/";
const deepLink = "tngdwallet://client/dl/transfer/moneyPacket/claim?p=ddb9c7e544e8b08c06394db076aa78985c16c24ea5abdfb18d2a104db6c389aab4ede2bc0e64dece5e1e43d5831c587a6669b66dd1fa35409156d8da957f7c9bb2ed7774302d36aaf9bb06f9e5c06935&v=2";
 
let fallbackTimer = null;
 
function openTNG() {
  // 尝试打开 app
  window.location.href = deepLink;
 
  // 1.5 秒 fallback：若 app 没打开则跳转官网
  clearTimeout(fallbackTimer);
  fallbackTimer = setTimeout(() => {
    window.location.href = fallbackURL;
  }, 1500);
}
 
// 如果页面被隐藏（说明 app 已打开），取消 fallback
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearTimeout(fallbackTimer);
  }
});
window.addEventListener("pagehide", () => clearTimeout(fallbackTimer));
window.addEventListener("blur", () => clearTimeout(fallbackTimer));
 
// 自动尝试一次（有些环境会被拦）
openTNG();
</script>
</body>
</html>
