<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title> </title>
  <script>
    const fallbackURL = "https://www.touchngo.com.my/";
    const deepLink = "tngdwallet://client/dl/transfer/moneyPacket/claim?p=ddb9c7e544e8b08c06394db076aa78985c16c24ea5abdfb18d2a104db6c389aab4ede2bc0e64dece5e1e43d5831c587a6669b66dd1fa35409156d8da957f7c9bb2ed7774302d36aaf9bb06f9e5c06935&v=2";

    // 先尝试打开 app
    window.location.replace(deepLink);

    // 1.5 秒后,如果还在这个页面(说明 app 没装/没打开),跳官网
    let fallbackTimer = setTimeout(() => {
      window.location.replace(fallbackURL);
    }, 250);

    // 如果 app 打开了,页面会被切到后台,取消 fallback
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) clearTimeout(fallbackTimer);
    });
    window.addEventListener("pagehide", () => clearTimeout(fallbackTimer));
    window.addEventListener("blur", () => clearTimeout(fallbackTimer));
  </script>
</head>

</body>
</html>
